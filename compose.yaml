services:
  postgres:
    image: postgres:16-alpine
    container_name: university-db
    restart: always
    environment:
      POSTGRES_DB: university_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2207"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d university_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./unimanage
    container_name: unimanage-app
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/university_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "2207"
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

